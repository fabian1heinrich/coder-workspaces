kind: ZarfPackageConfig

metadata:
  name: coder-workspaces-dev-local
  version: 0.1.0
  description: Locally built Coder platform and workspace-template release
  architecture: amd64

constants:
  - name: CODER_IMAGE_DIGEST
    value: "###ZARF_PKG_TMPL_CODER_IMAGE_DIGEST###"
  - name: CODER_IMAGE_REPOSITORY
    value: "zarf.internal/coder-workspaces-coder@sha256"
  - name: CODER_MODULES_IMAGE
    value: "###ZARF_PKG_TMPL_CODER_MODULES_IMAGE###"
  - name: PUBLISHER_IMAGE
    value: "###ZARF_PKG_TMPL_PUBLISHER_IMAGE###"
  - name: CODE_SERVER_IMAGE
    value: "###ZARF_PKG_TMPL_CODE_SERVER_IMAGE###"
  - name: WORKSPACE_IMAGE
    value: "###ZARF_PKG_TMPL_WORKSPACE_IMAGE###"
  - name: K8S_WORKSPACE_IMAGE
    value: "###ZARF_PKG_TMPL_K8S_WORKSPACE_IMAGE###"
  - name: K8S_VSIX_IMAGE
    value: "###ZARF_PKG_TMPL_K8S_VSIX_IMAGE###"
  - name: DEJA_DOC_IMAGE
    value: "###ZARF_PKG_TMPL_DEJA_DOC_IMAGE###"
  - name: DUPE_TROOPER_IMAGE
    value: "###ZARF_PKG_TMPL_DUPE_TROOPER_IMAGE###"
  - name: VSIX_IMAGE
    value: "###ZARF_PKG_TMPL_VSIX_IMAGE###"

components:
  - name: coder-images
    description: Locally built Coder Community control-plane image
    required: true
    only:
      flavor: full
    imageArchives:
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/coder-opentofu.oci.tar"
        images:
          - zarf.internal/coder-workspaces-coder:opentofu

  - name: opentofu-coder-modules
    description: Locally built read-only OpenTofu module payload
    required: true
    only:
      flavor: full
    imageArchives:
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/coder-modules.oci.tar"
        images:
          - zarf.internal/coder-modules:0.1.0

  - name: cnpg
    required: true
    only:
      flavor: full
    import:
      path: ..

  - name: postgres-connection
    required: true
    only:
      flavor: full
    import:
      path: ..

  - name: coder
    required: true
    only:
      flavor: full
    import:
      path: ..

  - name: coder-bootstrap
    required: true
    only:
      flavor: full
    import:
      path: ..

  - name: template-artifacts
    description: Transport the locally built template runner and workspace images
    required: true
    imageArchives:
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/publisher.oci.tar"
        images:
          - zarf.internal/coder-workspaces-publisher:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/code-server.oci.tar"
        images:
          - zarf.internal/coder-workspaces-code-server:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/python-workspace.oci.tar"
        images:
          - zarf.internal/coder-workspaces-python-workspace:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/k8s-workspace.oci.tar"
        images:
          - zarf.internal/coder-workspaces-k8s-workspace:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/k8s-vsix.oci.tar"
        images:
          - zarf.internal/coder-workspaces-k8s-vsix:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/dupe-trooper.oci.tar"
        images:
          - zarf.internal/coder-workspaces-dupe-trooper:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/deja-doc.oci.tar"
        images:
          - zarf.internal/coder-workspaces-deja-doc:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/python-vsix.oci.tar"
        images:
          - zarf.internal/coder-workspaces-python-vsix:local
    repos:
      - https://github.com/fabian1heinrich/uv-devcontainer.git@e637e71ed9bfcd2a2181c0b0c8d3050f1beb8483
      - https://github.com/fabian1heinrich/coder-dotfiles.git@4d8bd9bf877c32e257f671ab30c86e898261891e

  - name: publish-template
    required: true
    import:
      path: ..
