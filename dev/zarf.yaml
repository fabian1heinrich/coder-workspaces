kind: ZarfPackageConfig

metadata:
  name: coder-registry
  version: 0.1.0
  description: Registry-backed Coder platform and optional workspace-template release
  architecture: amd64

variables:
  - name: CODER_ADMIN_PASSWORD
    description: Password for the initial Coder administrator.
    default: ChangeMe123_
    prompt: false
    sensitive: true
    pattern: "^[A-Za-z0-9._~-]{8,128}$"
  - name: CLUSTER_NAME
    default: coder-postgres
    prompt: false
  - name: DB_NAME
    default: coder
    prompt: false
  - name: DB_SCHEMA
    default: coder
    prompt: false
  - name: DB_USER
    default: coder
    prompt: false
  - name: DB_PASSWORD
    description: PostgreSQL password using URL-unreserved characters only.
    default: coder
    prompt: false
    sensitive: true

constants:
  - name: PUBLISH_TEMPLATE
    value: all
  - name: UPDATE_WORKSPACE
    value: all
  - name: CODER_IMAGE_DIGEST
    value: "4a42711469c853fc68b2d82178d4132e87f438ea0af930ae7d5f0ed2445b557d"
  - name: CODER_IMAGE_REPOSITORY
    value: "ghcr.io/fabian1heinrich/coder-workspaces/coder@sha256"
  - name: CODER_MODULES_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/coder-modules@sha256:9d5660abd1eeeb1420713cd258ee4825638d16559e7a4f56a50ae4af35508562"
  - name: PUBLISHER_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/coderd-provider@sha256:e3a9e96ab74f5407c0f8533c338018a3cae46959235b5dbcd9eb55d70daaa916"
  - name: CODE_SERVER_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/code-server:0.1.0@sha256:8405424b2479f19052945ee65376fbbfabd97e1ac04bb9fabaf963074cb2cdf8"
  - name: WORKSPACE_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/python-workspace:0.1.0@sha256:9da7db38010f8fca3b97436aada761112856cdf2631ceede34efbce30f985266"
  - name: K8S_WORKSPACE_IMAGE
    value: "###ZARF_PKG_TMPL_K8S_WORKSPACE_IMAGE###"
  - name: K8S_VSIX_IMAGE
    value: "###ZARF_PKG_TMPL_K8S_VSIX_IMAGE###"
  - name: DUPE_TROOPER_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/dupe-trooper:0.1.0@sha256:301aa80382431ca6f6361e36c0c1220185af58971441267b1ae129cfffcd2935"
  - name: DEJA_DOC_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/deja-doc:0.1.0@sha256:fd540c6082c9a97a3a5741a9f357de86c500131ea98e19e4c72ccb594447d3fc"
  - name: VSIX_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/python-vsix:0.1.0@sha256:96e870317cbe15144a0d0f17ab2d8a1dc6d53dae121dc01f3d4751d62cbd628b"

components:
  - name: coder-images
    description: Coder Community control-plane image
    required: true
    only:
      flavor: full
    images:
      - ghcr.io/fabian1heinrich/coder-workspaces/coder@sha256:4a42711469c853fc68b2d82178d4132e87f438ea0af930ae7d5f0ed2445b557d

  - name: opentofu-coder-modules
    description: Read-only OpenTofu module payload
    required: true
    only:
      flavor: full
    images:
      - ghcr.io/fabian1heinrich/coder-workspaces/coder-modules@sha256:9d5660abd1eeeb1420713cd258ee4825638d16559e7a4f56a50ae4af35508562

  - name: cnpg
    description: Deploy CloudNativePG and the Coder PostgreSQL database
    required: true
    only:
      flavor: full
    import:
      url: oci://ghcr.io/fabian1heinrich/cnpg-zarf/cnpg:0.1.4@sha256:1d22fa46cf3f3e029b1399dfd598ac5bffe38d5a827977d1e828794f354b2edf

  - name: postgres-connection
    description: Provide Coder with the CNPG connection URL
    required: true
    only:
      flavor: full
    manifests:
      - name: coder-postgres-connection
        namespace: coder
        files:
          - postgres-connection.yaml

  - name: coder
    description: Deploy Coder Community with built-in offline provisioners
    required: true
    only:
      flavor: full
    healthChecks:
      - name: coder
        namespace: coder
        apiVersion: apps/v1
        kind: Deployment
    manifests:
      - name: coder-network-policy
        namespace: coder
        files:
          - network-policy.yaml
          - crd-discovery-rbac.yaml
    charts:
      # Coder chart 2.36.0, pinned to its OCI manifest.
      - name: coder
        version: 2.36.0
        namespace: coder
        url: oci://ghcr.io/coder/chart/coder@sha256:0937b0e588c420c2669bd41b089fd8087d793bed858be14c94399e8b259ccd2c
        releaseName: coder
        valuesFiles:
          - coder-values.yaml

  - name: coder-bootstrap
    description: Create the initial Coder administrator and issue the template publisher credential
    required: true
    actions:
      onDeploy:
        after:
          - cmd: |
              set -eu
              coder_url=http://coder.coder.svc.cluster.local
              ./zarf tools kubectl -n coder rollout status deployment/coder --timeout=2m
              ./zarf tools kubectl create namespace coder-template-publisher \
                --dry-run=client -o yaml | ./zarf tools kubectl apply -f -

              publisher_token="$(
                ./zarf tools kubectl -n coder-template-publisher \
                  get secret coder-template-publisher-auth \
                  -o go-template='{{.data.token | base64decode}}' 2>/dev/null || true
              )"
              if test -n "${publisher_token}" && printf '%s\n' "${publisher_token}" |
                ./zarf tools kubectl -n coder exec -i deploy/coder -- env \
                  CODER_URL="${coder_url}" \
                  /bin/sh -c '
                    IFS= read -r CODER_SESSION_TOKEN
                    export CODER_SESSION_TOKEN
                    export HOME=/tmp/coder-publisher-token-check
                    mkdir -p "$HOME"
                    trap "rm -rf /tmp/coder-publisher-token-check" EXIT
                    /opt/coder whoami >/dev/null 2>&1
                  '
              then
                exit 0
              fi

              # shellcheck disable=SC2016
              publisher_token="$(
                printf '%s\n' "${ZARF_VAR_CODER_ADMIN_PASSWORD}" |
                  ./zarf tools kubectl -n coder exec -i deploy/coder -- env \
                    CODER_URL="${coder_url}" \
                    CODER_FIRST_USER_USERNAME=admin \
                    CODER_FIRST_USER_FULL_NAME="Coder Admin" \
                    CODER_FIRST_USER_EMAIL=admin@coder.local \
                    CODER_FIRST_USER_TRIAL=false \
                    CODER_PUBLISHER_TOKEN_LIFETIME=168h \
                    /bin/sh -c '
                      IFS= read -r CODER_FIRST_USER_PASSWORD
                      export CODER_FIRST_USER_PASSWORD
                      export HOME=/tmp/coder-admin-bootstrap
                      mkdir -p "$HOME"
                      trap "rm -rf /tmp/coder-admin-bootstrap" EXIT
                      /opt/coder login "$CODER_URL" >/dev/null 2>&1
                      /opt/coder tokens remove --delete coder-template-publisher >/dev/null 2>&1 || true
                      /opt/coder tokens create --name coder-template-publisher --lifetime "$CODER_PUBLISHER_TOKEN_LIFETIME"
                    '
              )"
              printf '%s' "${publisher_token}" |
                ./zarf tools kubectl -n coder-template-publisher \
                  create secret generic coder-template-publisher-auth \
                  --from-file=token=/dev/stdin \
                  --dry-run=client \
                  -o yaml |
                ./zarf tools kubectl apply -f -
              ./zarf tools kubectl -n coder delete \
                secret/coder-template-publisher-auth --ignore-not-found
            description: Bootstrap the Coder administrator and template publisher credential
            mute: true

  # Keep template transport here so this definition is the only local package
  # entry point.
  - name: template-artifacts
    description: Transport the 0.1.0 workspace images, template runner, and Git repositories
    required: false
    default: true
    images:
      - ghcr.io/fabian1heinrich/coder-workspaces/coderd-provider@sha256:e3a9e96ab74f5407c0f8533c338018a3cae46959235b5dbcd9eb55d70daaa916
      - ghcr.io/fabian1heinrich/coder-workspaces/code-server@sha256:8405424b2479f19052945ee65376fbbfabd97e1ac04bb9fabaf963074cb2cdf8
      - ghcr.io/fabian1heinrich/coder-workspaces/python-workspace@sha256:9da7db38010f8fca3b97436aada761112856cdf2631ceede34efbce30f985266
      - "###ZARF_PKG_TMPL_K8S_WORKSPACE_DIGEST_REF###"
      - "###ZARF_PKG_TMPL_K8S_VSIX_DIGEST_REF###"
      - ghcr.io/fabian1heinrich/coder-workspaces/dupe-trooper@sha256:301aa80382431ca6f6361e36c0c1220185af58971441267b1ae129cfffcd2935
      - ghcr.io/fabian1heinrich/coder-workspaces/deja-doc@sha256:fd540c6082c9a97a3a5741a9f357de86c500131ea98e19e4c72ccb594447d3fc
      - ghcr.io/fabian1heinrich/coder-workspaces/python-vsix@sha256:96e870317cbe15144a0d0f17ab2d8a1dc6d53dae121dc01f3d4751d62cbd628b
    repos:
      - https://github.com/fabian1heinrich/uv-devcontainer.git@e637e71ed9bfcd2a2181c0b0c8d3050f1beb8483
      - https://github.com/fabian1heinrich/coder-dotfiles.git@4d8bd9bf877c32e257f671ab30c86e898261891e

  - name: publish-template
    description: Publish the Coder workspace templates using artifacts already loaded into Zarf
    required: false
    default: true
    actions:
      onDeploy:
        before:
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder rollout status deployment/coder --timeout=2m
              ./zarf tools kubectl -n coder-template-publisher \
                delete job template-publisher \
                --ignore-not-found --wait=true
            description: Prepare a fresh template publication Job
            mute: true
    manifests:
      - name: coder-workspace-template-publisher
        namespace: coder-template-publisher
        kustomizeAllowAnyDirectory: true
        kustomizations:
          - template-publisher
    healthChecks:
      - name: template-publisher
        namespace: coder-template-publisher
        apiVersion: batch/v1
        kind: Job

documentation:
  readme: README.md
