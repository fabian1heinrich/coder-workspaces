kind: ZarfPackageConfig

metadata:
  name: coder-workspaces-dev-components
  description: Shared local Coder platform and template publisher components
  architecture: amd64

variables:
  - name: CODER_ADMIN_PASSWORD
    description: Password for the initial Coder administrator.
    default: CoderZarf123?!
    prompt: false
    sensitive: true
    pattern: "^[A-Za-z0-9._~!?-]{8,128}$"
  - name: CLUSTER_NAME
    default: coder-postgres
    prompt: false
  - name: DB_NAME
    default: coder
    prompt: false
  - name: DB_SCHEMA
    default: coder
    prompt: false
  - name: DB_USER
    default: coder
    prompt: false
  - name: DB_PASSWORD
    description: PostgreSQL password using URL-unreserved characters only.
    default: coder
    prompt: false
    sensitive: true
  - name: SANDBOX_REPOSITORY
    description: Mirrored repository prefilled for the Python sandbox project.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: DEJA_DOC_REPOSITORY
    description: Mirrored repository prefilled for the deja-doc project.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: DUPE_TROOPER_REPOSITORY
    description: Mirrored repository prefilled for the dupe-trooper project.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: K8S_DEV_REPOSITORY
    description: Mirrored repository prefilled for the k8s-dev template.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: DEFAULT_DOTFILES_REPOSITORY
    description: Mirrored dotfiles repository; empty disables the dotfiles module.
    default: zarf-git-user/coder-dotfiles-3319437223
    prompt: false

components:
  - name: cnpg
    description: Deploy CloudNativePG and the Coder PostgreSQL database
    required: true
    import:
      url: oci://ghcr.io/fabian1heinrich/cnpg-zarf/cnpg:0.1.4@sha256:1d22fa46cf3f3e029b1399dfd598ac5bffe38d5a827977d1e828794f354b2edf

  - name: postgres-connection
    description: Provide Coder with the CNPG connection URL
    required: true
    manifests:
      - name: coder-postgres-connection
        namespace: coder
        files:
          - postgres-connection.yaml

  - name: coder
    description: Deploy Coder Community with built-in offline provisioners
    required: true
    healthChecks:
      - name: coder
        namespace: coder
        apiVersion: apps/v1
        kind: Deployment
    manifests:
      - name: coder-network-policy
        namespace: coder
        files:
          - network-policy.yaml
          - crd-discovery-rbac.yaml
    charts:
      # Coder chart 2.36.0, pinned to its OCI manifest.
      - name: coder
        version: 2.36.0
        namespace: coder
        url: oci://ghcr.io/coder/chart/coder@sha256:0937b0e588c420c2669bd41b089fd8087d793bed858be14c94399e8b259ccd2c
        releaseName: coder
        valuesFiles:
          - coder-values.yaml

  - name: coder-bootstrap
    description: Create the initial Coder administrator and issue the template publisher credential
    required: true
    actions:
      onDeploy:
        after:
          - cmd: |
              set -eu
              coder_url=http://coder.coder.svc.cluster.local
              ./zarf tools kubectl -n coder rollout status deployment/coder --timeout=2m
              ./zarf tools kubectl get namespace coder-template-publisher >/dev/null 2>&1 ||
                ./zarf tools kubectl create namespace coder-template-publisher
              if ./zarf tools kubectl -n coder-template-publisher \
                get secret coder-template-publisher-auth >/dev/null 2>&1; then
                exit 0
              fi
              publisher_token="$(
                printf '%s\n' "${ZARF_VAR_CODER_ADMIN_PASSWORD}" |
                  ./zarf tools kubectl -n coder exec -i deploy/coder -- env \
                    CODER_URL="${coder_url}" \
                    CODER_FIRST_USER_USERNAME=admin \
                    CODER_FIRST_USER_FULL_NAME="Coder Admin" \
                    CODER_FIRST_USER_EMAIL=admin@coder.local \
                    CODER_FIRST_USER_TRIAL=false \
                    /bin/sh -c '
                      IFS= read -r CODER_FIRST_USER_PASSWORD
                      export CODER_FIRST_USER_PASSWORD
                      /opt/coder login "$CODER_URL" >/dev/null
                      /opt/coder tokens create \
                        --name coder-template-publisher \
                        --lifetime 720h
                    '
              )"
              printf '%s' "${publisher_token}" |
                ./zarf tools kubectl -n coder-template-publisher \
                  create secret generic coder-template-publisher-auth \
                  --from-file=token=/dev/stdin
            description: Bootstrap the Coder administrator and template publisher credential
            mute: true

  - name: publish-template
    description: Publish the Coder workspace templates using artifacts already loaded into Zarf
    required: true
    actions:
      onDeploy:
        before:
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder rollout status deployment/coder --timeout=2m
              ./zarf tools kubectl -n coder-template-publisher \
                delete job template-publisher \
                --ignore-not-found --wait=true
            description: Prepare a fresh template publication Job
            mute: true
        after:
          # The generic Job health check also accepts running Jobs.
          - wait:
              cluster:
                kind: Job
                name: template-publisher
                namespace: coder-template-publisher
                condition: Complete=True
            maxTotalSeconds: 660
            description: Wait for successful template publication
    manifests:
      - name: coder-workspace-template-publisher
        namespace: coder-template-publisher
        kustomizeAllowAnyDirectory: true
        kustomizations:
          - template-publisher
    healthChecks:
      - name: template-publisher
        namespace: coder-template-publisher
        apiVersion: batch/v1
        kind: Job

documentation:
  readme: README.md
