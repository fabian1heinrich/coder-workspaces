kind: ZarfPackageConfig

metadata:
  name: coder-workspaces-dev-registry
  version: 0.1.0
  description: Registry-backed Coder platform and workspace-template release
  architecture: amd64

variables:
  - name: CODER_ADMIN_PASSWORD
    description: Password for the initial Coder administrator.
    default: CoderZarf123?!
    prompt: false
    sensitive: true
    pattern: "^[A-Za-z0-9._~!?-]{8,128}$"
  - name: CLUSTER_NAME
    default: coder-postgres
    prompt: false
  - name: DB_NAME
    default: coder
    prompt: false
  - name: DB_SCHEMA
    default: coder
    prompt: false
  - name: DB_USER
    default: coder
    prompt: false
  - name: DB_PASSWORD
    description: PostgreSQL password using URL-unreserved characters only.
    default: coder
    prompt: false
    sensitive: true
  - name: SANDBOX_REPOSITORY
    description: Mirrored repository prefilled for the Python sandbox project.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: DEJA_DOC_REPOSITORY
    description: Mirrored repository prefilled for the deja-doc project.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: DUPE_TROOPER_REPOSITORY
    description: Mirrored repository prefilled for the dupe-trooper project.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: K8S_DEV_REPOSITORY
    description: Mirrored repository prefilled for the k8s-dev template.
    default: zarf-git-user/uv-devcontainer-322178071
    prompt: false
  - name: DEFAULT_DOTFILES_REPOSITORY
    description: Mirrored dotfiles repository; empty disables the dotfiles module.
    default: zarf-git-user/coder-dotfiles-3319437223
    prompt: false

constants:
  - name: CODER_IMAGE_DIGEST
    value: "0cbe35abfbb7ba087fdd495f98b7c3a0a8c4d8dd92ea6ba8700eac32dd0f685c"
  - name: CODER_IMAGE_REPOSITORY
    value: "ghcr.io/fabian1heinrich/coder-workspaces/coder:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256"
  - name: CODER_MODULES_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/coder-modules:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:e4f10be5f9c6253c98ddce8d4f1b836c80463f78c1efcb8da0179955265136ba"
  - name: PUBLISHER_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/publisher:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:9ac40c87c7e5ffdcda2ff8aa2bf02f7a310bb0f8bd4061a73c5bc11bb5e4ba37"
  - name: CODE_SERVER_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/code-server:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:dd63e14c38e2a60b165f90b86d72c05ebf0faae2b54ce6cf38a30ec7c4bd84e1"
  - name: WORKSPACE_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/python-workspace:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:a60eada69bd2aa2117e0c40f0afaf1f9be667ad74f46d3182a85272a261ea295"
  - name: K8S_WORKSPACE_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/k8s-workspace:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:4d8258488a49a6a205ff99adaa293f0dfc10c02a1b812cc0c5beda9ac871fbd3"
  - name: K8S_VSIX_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/k8s-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:94270796aebd22397cac6404eccf6b26275dee4b61c0a662fcba3575edf73836"
  - name: DEJA_DOC_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/deja-doc:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:6cad2e90ed0fc00a4287e53687b3e5fc6551e6aa35f5bb99f76ea9040d7931b2"
  - name: DUPE_TROOPER_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/dupe-trooper:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:cf9abbef2aad9cf75579c22cb821f01b322ec296624eedfa6fd47b8e5306ecd2"
  - name: VSIX_IMAGE
    value: "ghcr.io/fabian1heinrich/coder-workspaces/python-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:c16f4cf49bdaf1136e78b0cd7e05f78ec72909bce78502fb5fa09ea01ee047cd"

components:
  - name: coder-images
    description: Coder Community control-plane image
    required: true
    only:
      flavor: full
    images:
      - ghcr.io/fabian1heinrich/coder-workspaces/coder:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:0cbe35abfbb7ba087fdd495f98b7c3a0a8c4d8dd92ea6ba8700eac32dd0f685c

  - name: opentofu-coder-modules
    description: Read-only OpenTofu module payload
    required: true
    only:
      flavor: full
    images:
      - ghcr.io/fabian1heinrich/coder-workspaces/coder-modules:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:e4f10be5f9c6253c98ddce8d4f1b836c80463f78c1efcb8da0179955265136ba

  - name: cnpg
    description: Deploy CloudNativePG and the Coder PostgreSQL database
    required: true
    only:
      flavor: full
    import:
      url: oci://ghcr.io/fabian1heinrich/cnpg-zarf/cnpg:0.1.4@sha256:1d22fa46cf3f3e029b1399dfd598ac5bffe38d5a827977d1e828794f354b2edf

  - name: postgres-connection
    description: Provide Coder with the CNPG connection URL
    required: true
    only:
      flavor: full
    manifests:
      - name: coder-postgres-connection
        namespace: coder
        files:
          - postgres-connection.yaml

  - name: coder
    description: Deploy Coder Community with built-in offline provisioners
    required: true
    only:
      flavor: full
    healthChecks:
      - name: coder
        namespace: coder
        apiVersion: apps/v1
        kind: Deployment
    manifests:
      - name: coder-network-policy
        namespace: coder
        files:
          - network-policy.yaml
          - crd-discovery-rbac.yaml
    charts:
      # Coder chart 2.36.0, pinned to its OCI manifest.
      - name: coder
        version: 2.36.0
        namespace: coder
        url: oci://ghcr.io/coder/chart/coder@sha256:0937b0e588c420c2669bd41b089fd8087d793bed858be14c94399e8b259ccd2c
        releaseName: coder
        valuesFiles:
          - coder-values.yaml

  - name: coder-bootstrap
    description: Create the initial Coder administrator and issue the template publisher credential
    required: true
    only:
      flavor: full
    actions:
      onDeploy:
        after:
          - cmd: |
              set -eu
              coder_url=http://coder.coder.svc.cluster.local
              ./zarf tools kubectl -n coder rollout status deployment/coder --timeout=2m
              ./zarf tools kubectl get namespace coder-template-publisher >/dev/null 2>&1 ||
                ./zarf tools kubectl create namespace coder-template-publisher
              if ./zarf tools kubectl -n coder-template-publisher \
                get secret coder-template-publisher-auth >/dev/null 2>&1; then
                exit 0
              fi
              publisher_token="$(
                printf '%s\n' "${ZARF_VAR_CODER_ADMIN_PASSWORD}" |
                  ./zarf tools kubectl -n coder exec -i deploy/coder -- env \
                    CODER_URL="${coder_url}" \
                    CODER_FIRST_USER_USERNAME=admin \
                    CODER_FIRST_USER_FULL_NAME="Coder Admin" \
                    CODER_FIRST_USER_EMAIL=admin@coder.local \
                    CODER_FIRST_USER_TRIAL=false \
                    /bin/sh -c '
                      IFS= read -r CODER_FIRST_USER_PASSWORD
                      export CODER_FIRST_USER_PASSWORD
                      /opt/coder login "$CODER_URL" >/dev/null
                      /opt/coder tokens create \
                        --name coder-template-publisher \
                        --lifetime 720h
                    '
              )"
              printf '%s' "${publisher_token}" |
                ./zarf tools kubectl -n coder-template-publisher \
                  create secret generic coder-template-publisher-auth \
                  --from-file=token=/dev/stdin
            description: Bootstrap the Coder administrator and template publisher credential
            mute: true

  # Keep template transport here so this definition is the only local package
  # entry point.
  - name: template-artifacts
    description: Transport the 0.1.0 workspace images, template runner, and Git repositories
    required: true
    images:
      - ghcr.io/fabian1heinrich/coder-workspaces/publisher:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:9ac40c87c7e5ffdcda2ff8aa2bf02f7a310bb0f8bd4061a73c5bc11bb5e4ba37
      - ghcr.io/fabian1heinrich/coder-workspaces/code-server:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:dd63e14c38e2a60b165f90b86d72c05ebf0faae2b54ce6cf38a30ec7c4bd84e1
      - ghcr.io/fabian1heinrich/coder-workspaces/python-workspace:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:a60eada69bd2aa2117e0c40f0afaf1f9be667ad74f46d3182a85272a261ea295
      - ghcr.io/fabian1heinrich/coder-workspaces/k8s-workspace:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:4d8258488a49a6a205ff99adaa293f0dfc10c02a1b812cc0c5beda9ac871fbd3
      - ghcr.io/fabian1heinrich/coder-workspaces/k8s-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:94270796aebd22397cac6404eccf6b26275dee4b61c0a662fcba3575edf73836
      - ghcr.io/fabian1heinrich/coder-workspaces/dupe-trooper:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:cf9abbef2aad9cf75579c22cb821f01b322ec296624eedfa6fd47b8e5306ecd2
      - ghcr.io/fabian1heinrich/coder-workspaces/deja-doc:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:6cad2e90ed0fc00a4287e53687b3e5fc6551e6aa35f5bb99f76ea9040d7931b2
      - ghcr.io/fabian1heinrich/coder-workspaces/python-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:c16f4cf49bdaf1136e78b0cd7e05f78ec72909bce78502fb5fa09ea01ee047cd
    repos:
      - https://github.com/fabian1heinrich/uv-devcontainer.git@e637e71ed9bfcd2a2181c0b0c8d3050f1beb8483
      - https://github.com/fabian1heinrich/coder-dotfiles.git@4d8bd9bf877c32e257f671ab30c86e898261891e

  - name: publish-template
    description: Publish the Coder workspace templates using artifacts already loaded into Zarf
    required: true
    actions:
      onDeploy:
        before:
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder rollout status deployment/coder --timeout=2m
              ./zarf tools kubectl -n coder-template-publisher \
                delete job template-publisher \
                --ignore-not-found --wait=true
            description: Prepare a fresh template publication Job
            mute: true
    manifests:
      - name: coder-workspace-template-publisher
        namespace: coder-template-publisher
        kustomizeAllowAnyDirectory: true
        kustomizations:
          - template-publisher
    healthChecks:
      - name: template-publisher
        namespace: coder-template-publisher
        apiVersion: batch/v1
        kind: Job

documentation:
  readme: README.md
