apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coder-template-publisher

resources:
  - namespace.yaml
  - ../../modules/workspace-pod
  - ../../template-publisher/base
  - ../../workspaces/k8s-dev
  - ../../workspaces/python

configMapGenerator:
  - name: template-publisher-environment
    envs:
      - publisher.env

patches:
  - path: job-patch.yaml
