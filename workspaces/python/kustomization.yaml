apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keys are the file names the template expects, so the publisher Job mounts
# the ConfigMap as the template directory itself. Build inputs in
# subdirectories are not template content and stay out of the payload.
configMapGenerator:
  - name: coder-template-python
    files:
      - .terraform.lock.hcl
      - README.md
      - agent.tf
      - auth.tf
      - deployment.tf
      - locals.tf
      - parameters.tf
      - projects.json
      - storage.tf
      - variables.tf
      - versions.tf
