name: Container images

on:
  pull_request:
    paths: &container_paths
      - ".github/workflows/container-images.yaml"
      - "*.Containerfile"
      - "modules/**"
      - "workspaces/**"
  push:
    branches:
      - main
    paths: *container_paths
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  UV_IMAGE: ghcr.io/astral-sh/uv:0.8.15-python3.13-trixie-slim@sha256:f01cf9b376c8109d92d2bb144dbff892e34103352a63a875e4a2c54cc127f24a

jobs:
  validate-python-locks:
    if: github.event_name == 'pull_request'
    name: Validate Python locks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check project lockfiles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' project_file; do
            project_dir="${project_file%/*}"
            docker run --rm \
              --entrypoint /usr/local/bin/uv \
              --env UV_CACHE_DIR=/tmp/uv-cache \
              --env UV_PYTHON_DOWNLOADS=never \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE/$project_dir:/project" \
              --workdir /project \
              "$UV_IMAGE" \
              lock --check
          done < <(
            find workspaces/python/images \
              -mindepth 2 \
              -maxdepth 2 \
              -name pyproject.toml \
              -print0 |
              sort -z
          )

  plan:
    name: Plan image matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Derive the image matrix from the project catalog
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          base='[
            {"image": "coder", "file": "coder.Containerfile", "version": "2.36.0-airgap"},
            {"image": "publisher", "file": "publisher.Containerfile", "version": "0.1.0"},
            {"image": "coder-modules", "file": "modules/Containerfile", "version": "0.1.0"},
            {"image": "code-server", "file": "workspaces/python/images/code-server.Containerfile", "version": "0.1.0", "workspace": true},
            {"image": "python-vsix", "file": "workspaces/python/extensions/python-extensions.Containerfile", "version": "0.1.0", "workspace": true},
            {"image": "python-workspace", "file": "workspaces/python/images/python.Containerfile", "version": "0.1.0", "target": "runtime", "workspace": true},
            {"image": "k8s-workspace", "file": "workspaces/k8s-dev/image/Containerfile", "version": "0.1.0", "workspace": true},
            {"image": "k8s-vsix", "file": "workspaces/k8s-dev/extensions/k8s-extensions.Containerfile", "version": "0.1.0", "workspace": true}
          ]'
          projects="$(
            jq -c '[.[] | {
              image: .name,
              file: "workspaces/python/images/python.Containerfile",
              version: "0.1.0",
              project: .name,
              target: "project",
              workspace: true
            }]' workspaces/python/projects.json
          )"
          matrix="$(
            jq -cn --argjson base "$base" --argjson projects "$projects" \
              '{include: ($base + $projects)}'
          )"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  validate:
    if: github.event_name == 'pull_request'
    name: Build ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name != 'pull_request'
    name: Publish ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Publish platform image
        if: matrix.workspace != true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Publish workspace image
        if: matrix.workspace == true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
