name: Container images

on:
  pull_request:
    paths: &container_paths
      - ".github/workflows/container-images.yaml"
      - "*.Containerfile"
      - "modules/**"
      - "workspaces/**"
  push:
    branches:
      - main
    paths: *container_paths
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  UV_IMAGE: ghcr.io/astral-sh/uv:0.8.15-python3.13-trixie-slim@sha256:f01cf9b376c8109d92d2bb144dbff892e34103352a63a875e4a2c54cc127f24a

jobs:
  validate-python-locks:
    if: github.event_name == 'pull_request'
    name: Validate Python locks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check project lockfiles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' project_file; do
            project_dir="${project_file%/*}"
            docker run --rm \
              --entrypoint /usr/local/bin/uv \
              --env UV_CACHE_DIR=/tmp/uv-cache \
              --env UV_PYTHON_DOWNLOADS=never \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE/$project_dir:/project" \
              --workdir /project \
              "$UV_IMAGE" \
              lock --check
          done < <(
            find workspaces/python/images \
              -mindepth 2 \
              -maxdepth 2 \
              -name pyproject.toml \
              -print0 |
              sort -z
          )

  plan:
    name: Plan image matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      has_images: ${{ steps.matrix.outputs.has_images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Derive the affected image matrix
        id: matrix
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base='[
            {"image": "coder", "file": "coder.Containerfile", "version": "2.36.0-airgap"},
            {"image": "publisher", "file": "publisher.Containerfile", "version": "0.1.0"},
            {"image": "coder-modules", "file": "modules/Containerfile", "version": "0.1.0"},
            {"image": "code-server", "file": "workspaces/python/images/code-server.Containerfile", "version": "0.1.0", "workspace": true},
            {"image": "python-vsix", "file": "workspaces/python/extensions/python-extensions.Containerfile", "version": "0.1.0", "workspace": true},
            {"image": "python-workspace", "file": "workspaces/python/images/python.Containerfile", "version": "0.1.0", "target": "runtime", "workspace": true},
            {"image": "k8s-workspace", "file": "workspaces/k8s-dev/image/Containerfile", "version": "0.1.0", "workspace": true},
            {"image": "k8s-vsix", "file": "workspaces/k8s-dev/extensions/k8s-extensions.Containerfile", "version": "0.1.0", "workspace": true}
          ]'
          projects="$(
            jq -c '[.[] | {
              image: .name,
              file: "workspaces/python/images/python.Containerfile",
              version: "0.1.0",
              project: .name,
              target: "project",
              workspace: true
            }]' workspaces/python/projects.json
          )"

          all="$(jq -cn --argjson base "$base" --argjson projects "$projects" '$base + $projects')"
          declare -A wanted=()

          want() {
            wanted["$1"]=1
          }

          want_projects() {
            while IFS= read -r project; do
              want "$project"
            done < <(jq -r '.[].image' <<< "$projects")
          }

          if test "$EVENT_NAME" = workflow_dispatch; then
            while IFS= read -r image; do
              want "$image"
            done < <(jq -r '.[].image' <<< "$all")
          else
            case "$EVENT_NAME" in
              pull_request) compare_sha="$PULL_REQUEST_BASE_SHA" ;;
              push) compare_sha="$BEFORE_SHA" ;;
              *) compare_sha= ;;
            esac

            if [[ ! "$compare_sha" =~ ^[0-9a-f]{40}$ ]] ||
              test "$compare_sha" = 0000000000000000000000000000000000000000
            then
              while IFS= read -r image; do
                want "$image"
              done < <(jq -r '.[].image' <<< "$all")
            else
              while IFS= read -r path; do
                case "$path" in
                  coder.Containerfile)
                    want coder
                    ;;
                  publisher.Containerfile)
                    want publisher
                    ;;
                  modules/Containerfile|modules/modules.lock|modules/workspace-pod/*.tf)
                    want coder-modules
                    ;;
                  workspaces/workspace-startup.sh)
                    want python-workspace
                    want k8s-workspace
                    want_projects
                    ;;
                  workspaces/python/images/python.Containerfile)
                    want python-workspace
                    want_projects
                    ;;
                  workspaces/python/images/code-server.Containerfile)
                    want code-server
                    ;;
                  workspaces/python/images/*/pyproject.toml|workspaces/python/images/*/uv.lock)
                    project="${path#workspaces/python/images/}"
                    project="${project%%/*}"
                    if jq -e --arg project "$project" \
                      'any(.[]; .image == $project)' <<< "$projects" >/dev/null
                    then
                      want "$project"
                    fi
                    ;;
                  workspaces/python/extensions/python-extensions.Containerfile|workspaces/python/extensions/python-extensions.lock)
                    want python-vsix
                    ;;
                  workspaces/k8s-dev/image/Containerfile)
                    want k8s-workspace
                    ;;
                  workspaces/k8s-dev/extensions/k8s-extensions.Containerfile|workspaces/k8s-dev/extensions/k8s-extensions.lock)
                    want k8s-vsix
                    ;;
                esac
              done < <(git diff --name-only "$compare_sha" "$HEAD_SHA")
            fi
          fi

          names="$(
            for image in "${!wanted[@]}"; do
              printf '%s\n' "$image"
            done | jq -Rsc 'split("\n") | map(select(length > 0))'
          )"
          matrix="$(
            jq -cn --argjson all "$all" --argjson names "$names" \
              '{include: [$all[] | select(.image as $image | $names | index($image))]}'
          )"
          if jq -e '.include | length > 0' <<< "$matrix" >/dev/null; then
            printf 'has_images=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_images=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  validate:
    if: github.event_name == 'pull_request' && needs.plan.outputs.has_images == 'true'
    name: Build ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name != 'pull_request' && needs.plan.outputs.has_images == 'true'
    name: Publish ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Publish platform image
        if: matrix.workspace != true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Publish workspace image
        if: matrix.workspace == true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        env:
          SOURCE_DATE_EPOCH: "0"
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
