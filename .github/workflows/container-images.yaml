name: Container images

on:
  pull_request:
    paths:
      - ".github/workflows/container-images.yaml"
      - "*.Containerfile"
      - "modules/**"
      - "workspaces/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/container-images.yaml"
      - "*.Containerfile"
      - "modules/**"
      - "workspaces/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: coder
            file: coder.Containerfile
            version: 2.36.0-airgap
          - image: coderd-provider
            file: coderd-provider.Containerfile
            version: 0.0.23
          - image: coder-modules
            file: modules/Containerfile
            version: 0.1.0
          - image: code-server
            file: workspaces/python/images/code-server.Containerfile
            version: 4.135.0
          - image: python-vsix
            file: workspaces/python/extensions/python-extensions.Containerfile
            version: 0.1.0
          - image: python-workspace
            file: workspaces/python/images/python.Containerfile
            version: 0.1.0
            target: runtime
          - image: dupe-trooper
            file: workspaces/python/images/python.Containerfile
            project: dupe-trooper
            target: project
          - image: deja-doc
            file: workspaces/python/images/python.Containerfile
            project: deja-doc
            target: project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.version && format('{0}/{1}:{2}', env.IMAGE_PREFIX, matrix.image, matrix.version) || '' }}
          build-args: |
            PROJECT=${{ matrix.project }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish:
    if: github.event_name != 'pull_request'
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: coder
            file: coder.Containerfile
            version: 2.36.0-airgap
          - image: coderd-provider
            file: coderd-provider.Containerfile
            version: 0.0.23
          - image: coder-modules
            file: modules/Containerfile
            version: 0.1.0
          - image: code-server
            file: workspaces/python/images/code-server.Containerfile
            version: 4.135.0
          - image: python-vsix
            file: workspaces/python/extensions/python-extensions.Containerfile
            version: 0.1.0
          - image: python-workspace
            file: workspaces/python/images/python.Containerfile
            version: 0.1.0
            target: runtime
          - image: dupe-trooper
            file: workspaces/python/images/python.Containerfile
            project: dupe-trooper
            target: project
          - image: deja-doc
            file: workspaces/python/images/python.Containerfile
            project: deja-doc
            target: project
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.version && format('{0}/{1}:{2}', env.IMAGE_PREFIX, matrix.image, matrix.version) || '' }}
          build-args: |
            PROJECT=${{ matrix.project }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
