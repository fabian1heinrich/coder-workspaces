name: Container images

on:
  pull_request:
    paths: &container_paths
      - ".github/workflows/container-images.yaml"
      - ".dockerignore"
      - "*.Containerfile"
      - "modules/Containerfile"
      - "modules/modules.lock"
      - "workspaces/workspace-startup.sh"
      - "workspaces/python/images/**"
      - "workspaces/python/extensions/**"
      - "workspaces/python/projects.json"
      - "workspaces/k8s-dev/image/**"
      - "workspaces/k8s-dev/extensions/**"
      - "!**/README.md"
  push:
    branches: [main]
    paths: *container_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  plan:
    name: Image matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Include catalog projects
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          base='[
            {"image": "coder", "file": "coder.Containerfile", "version": "2.36.0-airgap", "provenance": true},
            {"image": "publisher", "file": "publisher.Containerfile", "version": "0.1.0", "provenance": true},
            {"image": "coder-modules", "file": "modules/Containerfile", "version": "0.1.0", "provenance": true},
            {"image": "code-server", "file": "workspaces/python/images/code-server.Containerfile", "version": "0.1.0"},
            {"image": "python-vsix", "file": "workspaces/python/extensions/python-extensions.Containerfile", "version": "0.1.0"},
            {"image": "python-workspace", "file": "workspaces/python/images/python.Containerfile", "version": "0.1.0", "target": "runtime"},
            {"image": "k8s-workspace", "file": "workspaces/k8s-dev/image/Containerfile", "version": "0.1.0"},
            {"image": "k8s-vsix", "file": "workspaces/k8s-dev/extensions/k8s-extensions.Containerfile", "version": "0.1.0"}
          ]'
          projects="$(
            jq -c '[.[] | {
              image: .name,
              file: "workspaces/python/images/python.Containerfile",
              version: "0.1.0",
              project: .name,
              target: "project"
            }]' workspaces/python/projects.json
          )"

          matrix="$(jq -cn --argjson base "$base" --argjson projects "$projects" '{include: ($base + $projects)}')"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build image; publish only from main
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        env:
          SOURCE_DATE_EPOCH: "315532800"
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          provenance: ${{ matrix.provenance || false }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ matrix.version }}
          build-args: |
            IMAGE_VERSION=${{ matrix.version }}
            PROJECT=${{ matrix.project }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record published reference
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '`%s:sha-%s@%s`\n' "$IMAGE" "$GITHUB_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
