name: Python locks

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - "workspaces/python/images/*/pyproject.toml"

concurrency:
  group: python-locks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_IMAGE: ghcr.io/astral-sh/uv@sha256:a5727064a0de127bdb7c9d3c1383f3a9ac307d9f2d8a391edc7896c54289ced0

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Update Python locks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Generate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' project_file; do
            project_dir="${project_file%/*}"
            docker run --rm \
              --entrypoint /uv \
              --env UV_CACHE_DIR=/tmp/uv-cache \
              --env UV_PYTHON_DOWNLOADS=never \
              --user "$(id -u):$(id -g)" \
              --volume "$GITHUB_WORKSPACE/$project_dir:/project" \
              --workdir /project \
              "$UV_IMAGE" \
              lock
          done < <(
            find workspaces/python/images \
              -mindepth 2 \
              -maxdepth 2 \
              -name pyproject.toml \
              -print0 |
              sort -z
          )

      - name: Inspect generated changes
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({
            git diff --name-only --diff-filter=ACDMRTUXB
            git ls-files --others --exclude-standard
          } | sort -u | grep -Ev '^workspaces/python/images/[^/]+/uv\.lock$' || true)"
          if test -n "$unexpected"; then
            printf 'uv lock changed unexpected files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          if git diff --quiet -- ':(glob)workspaces/python/images/*/uv.lock' &&
            test -z "$(git ls-files --others --exclude-standard -- ':(glob)workspaces/python/images/*/uv.lock')"
          then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create lockfile bot token
        if: steps.generated.outputs.changed == 'true'
        id: app-token
        # actions/create-github-app-token 3.3.0
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PYTHON_LOCK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PYTHON_LOCK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit lockfiles
        if: steps.generated.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          bot_name="${BOT_SLUG}[bot]"
          bot_id="$(gh api "/users/$bot_name" --jq .id)"
          git config user.name "$bot_name"
          git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"
          gh auth setup-git
          git add -- ':(glob)workspaces/python/images/*/uv.lock'
          git commit -m 'chore: update Python dependency locks'
          git push origin "HEAD:${HEAD_REF}"
