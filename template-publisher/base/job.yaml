apiVersion: batch/v1
kind: Job
metadata:
  name: template-publisher
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-template-publisher
        app.kubernetes.io/component: template-publication
        app.kubernetes.io/part-of: coder
    spec:
      serviceAccountName: template-publisher
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          # Each package overlay patches this with its own registry and digest.
          image: publisher
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /source/publisher/publish.sh
          envFrom:
            - configMapRef:
                name: template-publisher-environment
          env:
            - name: CODER_URL
              value: http://coder.coder.svc.cluster.local
            - name: CODER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-template-publisher-auth
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: publisher-source
              mountPath: /source/publisher
              readOnly: true
            - name: python-template-source
              mountPath: /source/python-template
              readOnly: true
            - name: k8s-dev-template-source
              mountPath: /source/k8s-dev-template
              readOnly: true
            - name: workspace-pod-source
              mountPath: /source/workspace-pod
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: publisher-source
          configMap:
            name: coder-template-publisher
            defaultMode: 0444
        - name: python-template-source
          configMap:
            name: coder-template-python
            defaultMode: 0444
        - name: k8s-dev-template-source
          configMap:
            name: coder-template-k8s-dev
            defaultMode: 0444
        - name: workspace-pod-source
          configMap:
            name: coder-template-workspace-pod
            defaultMode: 0444
        - name: workspace
          emptyDir: {}
        - name: tmp
          emptyDir: {}
