# The publisher talks only to the Coder API, so its identity carries no
# Kubernetes permissions and no mounted token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: template-publisher
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
automountServiceAccountToken: false
