apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: template-publisher-egress
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: coder-template-publisher
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: "${CODER_WORKSPACES_NAMESPACE}"
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
        - ipBlock:
            cidr: fd00::/8
