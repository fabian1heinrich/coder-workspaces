# Shared publisher workload; consuming environments provide runtime values.
apiVersion: batch/v1
kind: Job
metadata:
  name: template-publisher
  annotations:
    kustomize.toolkit.fluxcd.io/force: Enabled
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: coder-template-publisher
        app.kubernetes.io/component: template-publication
        app.kubernetes.io/part-of: coder
    spec:
      serviceAccountName: template-publisher
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: "${CODER_WORKSPACES_PULL_SECRET}"
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publish
          image: "${CODER_WORKSPACES_REGISTRY}/fabian1heinrich/coder-workspaces/coderd-provider@sha256:e3a9e96ab74f5407c0f8533c338018a3cae46959235b5dbcd9eb55d70daaa916"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p /workspace/config/publisher /workspace/config/workspaces/python /workspace/config/workspaces/k8s-dev
              cp -L /source/publisher/.terraform.lock.hcl /source/publisher/*.tf /source/publisher/publish.sh /workspace/config/publisher/
              cp -LR /source/python-template/. /workspace/config/workspaces/python/
              cp -LR /source/k8s-dev-template/. /workspace/config/workspaces/k8s-dev/
              chmod 0755 /workspace/config/publisher/publish.sh
              exec /workspace/config/publisher/publish.sh
          env:
            - name: PUBLISHER_STATE_SUFFIX
              value: "${CODER_WORKSPACES_STATE_SUFFIX}"
            - name: PUBLISH_TEMPLATE
              value: all
            - name: UPDATE_WORKSPACE
              value: ""
            - name: CODER_ORGANIZATION
              value: "${CODER_WORKSPACES_CODER_ORGANIZATION}"
            - name: CODER_URL
              value: "${CODER_WORKSPACES_CODER_URL}"
            - name: TF_VAR_coder_url
              value: "${CODER_WORKSPACES_CODER_URL}"
            - name: KUBE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBE_IN_CLUSTER_CONFIG
              value: "true"
            - name: CODER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "${CODER_WORKSPACES_PUBLISHER_SECRET}"
                  key: token
            - name: TF_VAR_coder_token
              valueFrom:
                secretKeyRef:
                  name: "${CODER_WORKSPACES_PUBLISHER_SECRET}"
                  key: token
            - name: TF_VAR_coder_namespace
              value: "${CODER_WORKSPACES_NAMESPACE}"
            - name: TF_VAR_workspace_image
              value: "${CODER_WORKSPACES_REGISTRY}/fabian1heinrich/coder-workspaces/python-workspace:0.1.0@sha256:9da7db38010f8fca3b97436aada761112856cdf2631ceede34efbce30f985266"
            - name: TF_VAR_k8s_workspace_image
              value: "${CODER_WORKSPACES_REGISTRY}/fabian1heinrich/coder-workspaces/k8s-workspace:0.1.0@sha256:${CODER_WORKSPACES_K8S_WORKSPACE_DIGEST}"
            - name: TF_VAR_k8s_vsix_image
              value: "${CODER_WORKSPACES_REGISTRY}/fabian1heinrich/coder-workspaces/k8s-vsix:0.1.0@sha256:${CODER_WORKSPACES_K8S_VSIX_DIGEST}"
            - name: TF_VAR_kubernetes_service_account_name
              value: "${CODER_WORKSPACES_KUBERNETES_SERVICE_ACCOUNT}"
            - name: TF_VAR_kubernetes_target_namespace
              value: "${CODER_WORKSPACES_KUBERNETES_TARGET_NAMESPACE}"
            - name: TF_VAR_dupe_trooper_image
              value: ""
            - name: TF_VAR_deja_doc_image
              value: ""
            - name: TF_VAR_vsix_image
              value: "${CODER_WORKSPACES_REGISTRY}/fabian1heinrich/coder-workspaces/python-vsix:0.1.0@sha256:96e870317cbe15144a0d0f17ab2d8a1dc6d53dae121dc01f3d4751d62cbd628b"
            - name: TF_VAR_code_server_image
              value: "${CODER_WORKSPACES_REGISTRY}/fabian1heinrich/coder-workspaces/code-server:0.1.0@sha256:8405424b2479f19052945ee65376fbbfabd97e1ac04bb9fabaf963074cb2cdf8"
            - name: TF_VAR_home_storage_class
              value: "${CODER_WORKSPACES_HOME_STORAGE_CLASS}"
            - name: TF_VAR_image_pull_secret_name
              value: "${CODER_WORKSPACES_PULL_SECRET}"
            - name: TF_VAR_git_secret_name
              value: "${CODER_WORKSPACES_GIT_SECRET}"
            - name: TF_VAR_git_base_url
              value: "${CODER_WORKSPACES_GIT_BASE_URL}"
            - name: TF_VAR_git_auth_mode
              value: "${CODER_WORKSPACES_GIT_AUTH_MODE}"
            - name: TF_VAR_git_external_auth_id
              value: "${CODER_WORKSPACES_GIT_EXTERNAL_AUTH_ID}"
            - name: TF_VAR_platform_ca_config_map_name
              value: "${CODER_WORKSPACES_CA_CONFIG_MAP}"
            - name: TF_VAR_default_repository
              value: "${CODER_WORKSPACES_DEFAULT_REPOSITORY}"
            - name: TF_VAR_default_git_branch
              value: "${CODER_WORKSPACES_DEFAULT_GIT_BRANCH}"
            - name: TF_VAR_k8s_default_repository
              value: "${CODER_WORKSPACES_K8S_DEFAULT_REPOSITORY}"
            - name: TF_VAR_k8s_default_git_branch
              value: "${CODER_WORKSPACES_K8S_DEFAULT_GIT_BRANCH}"
            - name: TF_VAR_default_dotfiles_repository
              value: "${CODER_WORKSPACES_DEFAULT_DOTFILES_REPOSITORY}"
            - name: TF_VAR_default_dotfiles_branch
              value: "${CODER_WORKSPACES_DEFAULT_DOTFILES_BRANCH}"
            - name: TF_VAR_publish_id
              value: "${CODER_WORKSPACES_PUBLISH_ID}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: publisher-source
              mountPath: /source/publisher
              readOnly: true
            - name: python-template-source
              mountPath: /source/python-template
              readOnly: true
            - name: k8s-dev-template-source
              mountPath: /source/k8s-dev-template
              readOnly: true
            - name: config
              mountPath: /workspace/config
            - name: cache
              mountPath: /workspace/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: publisher-source
          configMap:
            name: coder-template-publisher
            defaultMode: 0444
            items:
              - key: publisher-lock.hcl
                path: .terraform.lock.hcl
              - key: backend.tf
                path: backend.tf
              - key: provider.tf
                path: provider.tf
              - key: publish.sh
                path: publish.sh
              - key: template.tf
                path: template.tf
              - key: variables.tf
                path: variables.tf
              - key: versions.tf
                path: versions.tf
        - name: python-template-source
          configMap:
            name: coder-template-python
            defaultMode: 0444
            items:
              - key: python-template-lock.hcl
                path: .terraform.lock.hcl
              - key: python-template-readme.md
                path: README.md
              - key: python-template-agent.tf
                path: agent.tf
              - key: python-template-auth.tf
                path: auth.tf
              - key: python-template-deployment.tf
                path: deployment.tf
              - key: python-template-locals.tf
                path: locals.tf
              - key: python-template-parameters.tf
                path: parameters.tf
              - key: python-template-storage.tf
                path: storage.tf
              - key: python-template-variables.tf
                path: variables.tf
              - key: python-template-versions.tf
                path: versions.tf
        - name: k8s-dev-template-source
          configMap:
            name: coder-template-k8s-dev
            defaultMode: 0444
            items:
              - key: k8s-dev-template-lock.hcl
                path: .terraform.lock.hcl
              - key: k8s-dev-template-readme.md
                path: README.md
              - key: k8s-dev-template-agent.tf
                path: agent.tf
              - key: k8s-dev-template-auth.tf
                path: auth.tf
              - key: k8s-dev-template-deployment.tf
                path: deployment.tf
              - key: k8s-dev-template-locals.tf
                path: locals.tf
              - key: k8s-dev-template-parameters.tf
                path: parameters.tf
              - key: k8s-dev-template-storage.tf
                path: storage.tf
              - key: k8s-dev-template-variables.tf
                path: variables.tf
              - key: k8s-dev-template-versions.tf
                path: versions.tf
        - name: config
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
