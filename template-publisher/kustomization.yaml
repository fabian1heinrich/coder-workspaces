apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml
  - network-policy.yaml
  - state-backend-rbac.yaml

configMapGenerator:
  - name: coder-template-publisher
    files:
      - publisher-lock.hcl=.terraform.lock.hcl
      - backend.tf
      - provider.tf
      - publish.sh
      - template.tf
      - variables.tf
      - versions.tf

generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
