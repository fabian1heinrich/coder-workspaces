apiVersion: v1
kind: ServiceAccount
metadata:
  name: template-publisher
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: template-publisher-state
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - create
      - update
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: template-publisher-state
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: template-publisher-state
subjects:
  - kind: ServiceAccount
    name: template-publisher
