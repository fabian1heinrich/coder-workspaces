kind: ZarfPackageConfig

metadata:
  name: coder-workspaces-publish
  version: "###ZARF_PKG_TMPL_RELEASE_ID###"
  description: Publish the Coder workspace templates to an existing Coder deployment
  architecture: amd64

variables:
  - name: CODER_TOKEN
    description: >-
      Short-lived Coder API token created manually immediately before
      deployment and supplied by the release's just publish recipe. Revoke it
      in Coder after deployment; it is never stored in this package or the
      release media.
    sensitive: true
    pattern: "^.+$"
    prompt: true
  - name: REGISTRY
    description: Internal registry holding the mirrored workspace images.
    pattern: "^[a-zA-Z0-9.-]+(:[0-9]+)?$"
    prompt: true
  - name: DEJA_DOC_IMAGE
    description: Digest-pinned deja-doc workspace image; empty disables the project.
    default: ""
    prompt: false
  - name: DEJA_DOC_REPOSITORY
    description: Default owner/repository for the deja-doc project.
    default: ""
    prompt: false
  - name: DUPE_TROOPER_IMAGE
    description: Digest-pinned dupe-trooper workspace image; empty disables the project.
    default: ""
    prompt: false
  - name: DUPE_TROOPER_REPOSITORY
    description: Default owner/repository for the dupe-trooper project.
    default: ""
    prompt: false
  - name: HOME_STORAGE_CLASS
    description: StorageClass for persistent workspace homes; empty uses the default.
    default: ""
    prompt: false
  - name: PLATFORM_CA_CONFIG_MAP_NAME
    description: ConfigMap in the workspace namespace containing platform-root-ca.pem; empty disables the mount.
    default: ""
    prompt: false
  - name: GIT_BASE_URL
    description: Base URL of the Git service used by workspace repositories.
    default: ""
    prompt: false
  - name: SANDBOX_REPOSITORY
    description: Default owner/repository for the Python sandbox project.
    default: ""
    prompt: false
  - name: K8S_DEV_REPOSITORY
    description: Default owner/repository for the k8s-dev template.
    default: ""
    prompt: false
  - name: DEFAULT_DOTFILES_REPOSITORY
    description: Default dotfiles owner/repository.
    default: ""
    prompt: false

# Digests are baked at create time and resolved against the deployment's own
# registry, which the images package mirrors beforehand.
constants:
  - name: PUBLISHER_IMAGE
    value: "fabian1heinrich/coder-workspaces/publisher:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:9ac40c87c7e5ffdcda2ff8aa2bf02f7a310bb0f8bd4061a73c5bc11bb5e4ba37"
  - name: WORKSPACE_IMAGE
    value: "fabian1heinrich/coder-workspaces/python-workspace:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:a60eada69bd2aa2117e0c40f0afaf1f9be667ad74f46d3182a85272a261ea295"
  - name: K8S_WORKSPACE_IMAGE
    value: "fabian1heinrich/coder-workspaces/k8s-workspace:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:4d8258488a49a6a205ff99adaa293f0dfc10c02a1b812cc0c5beda9ac871fbd3"
  - name: K8S_VSIX_IMAGE
    value: "fabian1heinrich/coder-workspaces/k8s-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:94270796aebd22397cac6404eccf6b26275dee4b61c0a662fcba3575edf73836"
  - name: CODE_SERVER_IMAGE
    value: "fabian1heinrich/coder-workspaces/code-server:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:dd63e14c38e2a60b165f90b86d72c05ebf0faae2b54ce6cf38a30ec7c4bd84e1"
  - name: VSIX_IMAGE
    value: "fabian1heinrich/coder-workspaces/python-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:c16f4cf49bdaf1136e78b0cd7e05f78ec72909bce78502fb5fa09ea01ee047cd"

# The production cluster uses its own registry for these independently released
# images. Deploy with `zarf package deploy --connected` so Zarf applies the
# fully qualified image references without importing or rewriting them.
components:
  - name: publish-templates
    description: Create the publisher credential and run the template publication Job
    required: true
    actions:
      onDeploy:
        before:
          - cmd: |
              set -eu
              registry_config="$(
                ./zarf tools kubectl -n coder-template-publisher \
                  get secret zot-reader \
                  -o jsonpath='{.data.\.dockerconfigjson}' |
                  base64 --decode
              )"
              if ! printf '%s' "$registry_config" |
                jq -e --arg registry "${ZARF_VAR_REGISTRY:?}" '
                  .auths[$registry] as $credentials
                  | ($credentials | type == "object")
                    and (
                      (($credentials.auth // "") | length) > 0
                      or (
                        (($credentials.username // "") | length) > 0
                        and (($credentials.password // "") | length) > 0
                      )
                    )
                ' >/dev/null; then
                echo "Secret coder-template-publisher/zot-reader has no credentials for ${ZARF_VAR_REGISTRY}" >&2
                exit 1
              fi
            description: Verify the publisher registry credential
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder \
                rollout status deployment/coder --timeout=5m
              expected_reference="${ZARF_VAR_REGISTRY:?}/fabian1heinrich/coder-workspaces/coder-modules:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:e4f10be5f9c6253c98ddce8d4f1b836c80463f78c1efcb8da0179955265136ba"
              deployment="$(
                ./zarf tools kubectl -n coder get deployment coder -o json
              )"
              if ! printf '%s' "$deployment" | jq -e --arg reference "$expected_reference" '
                any(
                  .spec.template.spec.volumes[]?;
                  .name == "coder-modules" and .image.reference == $reference
                )
                and any(
                  .spec.template.spec.containers[]?
                  | select(.name == "coder")
                  | .volumeMounts[]?;
                  .name == "coder-modules"
                    and .mountPath == "/opt/coder-modules"
                    and .readOnly == true
                )
              ' >/dev/null; then
                actual_reference="$(
                  printf '%s' "$deployment" |
                    jq -r '.spec.template.spec.volumes[]? | select(.name == "coder-modules") | .image.reference // "<missing>"'
                )"
                echo "Coder is not running the required module volume." >&2
                echo "Expected: ${expected_reference}" >&2
                echo "Observed: ${actual_reference:-<missing>}" >&2
                exit 1
              fi
            description: Verify the built-in provisioner module volume
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder-template-publisher \
                delete job template-publisher --ignore-not-found --wait=true
            description: Remove a previous publication Job
            mute: true
          - cmd: |
              set -eu
              printf '%s' "${ZARF_VAR_CODER_TOKEN:?}" |
                ./zarf tools kubectl -n coder-template-publisher create secret generic \
                  coder-template-publisher-auth --from-file=token=/dev/stdin \
                  --dry-run=client -o yaml |
                ./zarf tools kubectl apply --server-side -f -
            description: Create the short-lived publishing credential
            mute: true
        # Keep the credential until the Job health check succeeds. `after`
        # runs after resource application and is too early for Pod startup.
        onSuccess:
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder-template-publisher \
                delete secret coder-template-publisher-auth --ignore-not-found
            description: Remove the publishing credential after publication
            mute: true
        onFailure:
          - cmd: |
              set -eu
              ./zarf tools kubectl -n coder-template-publisher \
                delete job template-publisher --ignore-not-found --wait=true
              ./zarf tools kubectl -n coder-template-publisher \
                delete secret coder-template-publisher-auth --ignore-not-found
            description: Remove the failed publication Job and its credential
            mute: true
    manifests:
      - name: coder-workspace-template-publisher
        kustomizeAllowAnyDirectory: true
        kustomizations:
          - manifests
    healthChecks:
      - name: template-publisher
        namespace: coder-template-publisher
        apiVersion: batch/v1
        kind: Job

documentation:
  readme: ../README.md
