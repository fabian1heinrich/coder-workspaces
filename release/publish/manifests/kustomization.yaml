apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coder-template-publisher

resources:
  - credential.yaml
  - ../../../template-publisher/base
  - ../../../workspaces/k8s-dev
  - ../../../workspaces/python

configMapGenerator:
  - name: template-publisher-environment
    envs:
      - publisher.env

patches:
  - path: job-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: template-publisher-egress
    patch: |-
      - op: replace
        path: /spec/egress/1/to/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: coder
