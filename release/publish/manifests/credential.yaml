# The publishing credential is supplied at deploy time through
# ZARF_VAR_CODER_TOKEN and is never stored in this repository, the package, or
# the release media. It is created fresh on every publication.
apiVersion: v1
kind: Secret
metadata:
  name: coder-template-publisher-auth
  namespace: coder-template-publisher
  labels:
    app.kubernetes.io/name: coder-template-publisher
    app.kubernetes.io/component: template-publication
    app.kubernetes.io/part-of: coder
type: Opaque
stringData:
  token: "###ZARF_VAR_CODER_TOKEN###"
