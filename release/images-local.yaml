kind: ZarfPackageConfig

metadata:
  name: coder-workspaces-images
  version: "###ZARF_PKG_TMPL_RELEASE_ID###"
  description: Mirror locally built production Coder workspace and publisher images
  architecture: amd64

components:
  - name: workspace-images
    required: true
    imageArchives:
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/python-workspace.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/python-workspace:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/k8s-workspace.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/k8s-workspace:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/coder-modules.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/coder-modules:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/code-server.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/code-server:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/python-vsix.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/python-vsix:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/k8s-vsix.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/k8s-vsix:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/deja-doc.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/deja-doc:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/dupe-trooper.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/dupe-trooper:local
      - path: "###ZARF_PKG_TMPL_BUILD_DIR###/publisher.oci.tar"
        images:
          - registry.invalid/fabian1heinrich/coder-workspaces/publisher:local
