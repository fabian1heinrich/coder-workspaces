      - registry.invalid/fabian1heinrich/coder-workspaces/dupe-trooper:sha-6732c3fd1b4fe30680be4956ebe9901a97058aa6@sha256:fc2c9207cefd1793a429207bde4d020768e29a568b8af427e8f6619646385ccc

