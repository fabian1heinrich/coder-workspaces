kind: ZarfPackageConfig

metadata:
  name: coder-workspaces-images
  version: "###ZARF_PKG_TMPL_RELEASE_ID###"
  description: Mirror production Coder workspace and publisher images
  architecture: amd64

# Runtime/project digests verified against Actions run 40536090561 (6732c3f).
components:
  - name: workspace-runtime
    description: Python and Kubernetes operations workspace runtimes 0.1.0
    required: true
    images:
      - registry.invalid/fabian1heinrich/coder-workspaces/python-workspace:sha-6732c3fd1b4fe30680be4956ebe9901a97058aa6@sha256:37954a40fd65d61453492eb7aa0b9d66635c73af8e1537bc9a43f8129bec19cf
      - registry.invalid/fabian1heinrich/coder-workspaces/k8s-workspace:sha-6732c3fd1b4fe30680be4956ebe9901a97058aa6@sha256:1cd00c86aa816097a5909361b88898498dd504f6c5eda46091543c9f92d007b6

  # Advance this image only when modules.lock or modules/Containerfile changes;
  # workspace-pod is bundled into each template. Templates resolve the pinned
  # upstream Coder modules from this payload, so the consuming control-plane
  # release must transport this exact digest before mounting it at
  # /opt/coder-modules. Carrying it here as well keeps the workspace release
  # portable and repeated mirroring is safe.
  - name: coder-modules
    description: Read-only OpenTofu module payload, including the shared workspace-pod module
    required: true
    images:
      - registry.invalid/fabian1heinrich/coder-workspaces/coder-modules:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:e4f10be5f9c6253c98ddce8d4f1b836c80463f78c1efcb8da0179955265136ba

  - name: workspace-tooling
    description: Read-only code-server and VSIX payloads 0.1.0
    required: true
    images:
      - registry.invalid/fabian1heinrich/coder-workspaces/code-server:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:dd63e14c38e2a60b165f90b86d72c05ebf0faae2b54ce6cf38a30ec7c4bd84e1
      - registry.invalid/fabian1heinrich/coder-workspaces/python-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:c16f4cf49bdaf1136e78b0cd7e05f78ec72909bce78502fb5fa09ea01ee047cd
      - registry.invalid/fabian1heinrich/coder-workspaces/k8s-vsix:sha-36f435f0b3de849e4704f6eed45236f8645e6166@sha256:94270796aebd22397cac6404eccf6b26275dee4b61c0a662fcba3575edf73836

